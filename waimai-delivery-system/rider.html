<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <link rel="stylesheet" href="/static/css/style.css" />

    <div id="tabHall" class="tab-panel"><div id="hallList"></div></div>
    <div id="tabActive" class="tab-panel" style="display:none"><div id="activeList"></div></div>
    <div id="tabHistory" class="tab-panel" style="display:none"><div id="historyList"></div></div>
