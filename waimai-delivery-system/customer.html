<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>顾客端 · 校园外卖配送系统</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    .merchant-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .merchant-card { display: flex; gap: 12px; cursor: pointer; transition: transform .12s; }
    .merchant-card:hover { transform: translateY(-2px); }
    .merchant-card .m-ico {
      width: 58px; height: 58px; border-radius: 12px; background: var(--primary-light);
      display: flex; align-items: center; justify-content: center; font-size: 30px; flex-shrink: 0;
    }
    .menu-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .dish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .dish-card { display: flex; gap: 12px; align-items: center; border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .dish-card .info { flex: 1; min-width: 0; }
    .dish-card .name { font-weight: 600; font-size: 14px; }
    .dish-card .price { color: var(--danger); font-weight: 700; margin-top: 2px; }
    .dish-card .meta { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
    /* 底部购物车条 */
    #cartBar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 60;
      background: #1f2937; color: #fff; display: none; align-items: center;
      padding: 12px 20px; gap: 14px; border-radius: 16px 16px 0 0;
    }
    #cartBar .cart-ico { font-size: 24px; position: relative; }
    #cartBar .cart-count {
      position: absolute; top: -6px; right: -10px; background: var(--danger); color: #fff;
      font-size: 11px; border-radius: 999px; padding: 1px 6px;
    }
    .qty-ctl { display: inline-flex; align-items: center; gap: 8px; }
    .qty-ctl button { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-weight: 700; }
    .cart-list { max-height: 300px; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="topbar"></div>
  <div class="container">
    <div class="tabs" id="mainTabs">
      <button class="tab-btn active" data-tab="tabOrder">🛍️ 点餐</button>
      <button class="tab-btn" data-tab="tabMyOrders">📋 我的订单</button>
      <button class="tab-btn" data-tab="tabAddresses">📍 我的地址</button>
    </div>

    <!-- 点餐 -->
    <div id="tabOrder" class="tab-panel">
      <div id="merchantList"></div>
      <div id="menuView" style="display:none"></div>
    </div>

    <!-- 我的订单 -->
    <div id="tabMyOrders" class="tab-panel" style="display:none">
      <div id="myOrders"></div>
    </div>

    <!-- 我的地址 -->
    <div id="tabAddresses" class="tab-panel" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <div class="muted" style="font-size:13px">下单时一键选用，免去重复填写</div>
        <button class="btn small" id="btnAddAddress">+ 新增地址</button>
      </div>
      <div id="addressList"></div>
    </div>
  </div>

  <!-- 底部购物车条 -->
  <div id="cartBar">
    <div class="cart-ico">🛒<span class="cart-count" id="cartCount">0</span></div>
    <div style="flex:1">
      <div style="font-weight:600" id="cartMerchant"></div>
      <div style="font-size:12px;opacity:.8" id="cartSummary"></div>
    </div>
    <button class="btn" id="btnCheckout">去结算</button>
    <button class="btn ghost small" onclick="clearCart(true)">清空</button>
  </div>

  <!-- 结算弹窗 -->
  <div class="modal-mask" id="checkoutModal">
    <div class="modal">
      <h3>确认订单</h3>
      <div id="checkoutItems" class="muted" style="margin-bottom:12px;line-height:1.9"></div>

      <div class="field">
        <label>配送地址 *</label>
        <div id="ckAddressList" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px"></div>
        <input id="ckAddress" placeholder="或手动输入详细地址" />
      </div>

      <div class="field"><label>备注（选填）</label><input id="ckRemark" placeholder="口味偏好、放哪里等" /></div>

      <div class="field" style="background:#f6f8fa;padding:10px 12px;border-radius:10px;margin-bottom:8px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" id="ckCutlery" style="width:auto" />
          <span>🌿 需要一次性餐具</span>
        </label>
        <div class="muted" style="font-size:12px;margin-top:4px;margin-left:24px">
          不勾选 = 支持环保：商家不再附带一次性筷子/勺子。
          可在"备注"里写明自备餐具是否方便等。
        </div>
      </div>

      <div style="text-align:right;font-size:16px;margin-bottom:6px">合计：<b style="color:var(--danger)" id="ckTotal"></b></div>
      <div class="modal-foot">
        <button class="btn ghost" onclick="closeModal('checkoutModal')">再逛逛</button>
        <button class="btn" id="btnSubmitOrder">提交订单</button>
      </div>
    </div>
  </div>

  <!-- 地址编辑弹窗 -->
  <div class="modal-mask" id="addressModal">
    <div class="modal">
      <h3 id="addressModalTitle">新增收货地址</h3>
      <div class="field"><label>收货人 *</label><input id="adName" placeholder="例如：李芊泉" /></div>
      <div class="field"><label>收货电话 *</label><input id="adPhone" placeholder="例如：13800000001" /></div>
      <div class="field"><label>地址标签（选填）</label>
        <input id="adLabel" placeholder="家 / 公司 / 宿舍 …" maxlength="16" />
      </div>
      <div class="field"><label>详细地址 *</label>
        <textarea id="adDetail" rows="2" placeholder="街道、楼栋、门牌号"></textarea>
      </div>
      <div class="field"><label><input type="checkbox" id="adDefault" style="width:auto" /> 设为默认地址</label></div>
      <div class="modal-foot">
        <button class="btn ghost" onclick="closeModal('addressModal')">取消</button>
        <button class="btn" id="btnSaveAddress">保存</button>
      </div>
    </div>
  </div>

  <!-- 评价弹窗 -->
  <div class="modal-mask" id="commentModal">
    <div class="modal">
      <h3>评价本单</h3>
      <div style="text-align:center;margin-bottom:12px">
        <span class="stars" id="starPick">★★★★★</span>
        <div class="muted" id="starTip">点击星星选择评分</div>
      </div>
      <div class="field"><label>评价内容（选填）</label>
        <textarea id="cmContent" rows="3" placeholder="味道、包装、配送速度…"></textarea></div>
      <div class="modal-foot">
        <button class="btn ghost" onclick="closeModal('commentModal')">取消</button>
        <button class="btn" id="btnSubmitComment">提交评价</button>
      </div>
    </div>
  </div>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/customer.js"></script>
</body>
</html>
